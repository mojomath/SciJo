name: SciJo Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  testing-scijo:
    name: with ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest"]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | sh

      - name: Add path
        run: |
          echo "PIXI_HOME=$HOME/.pixi" >> $GITHUB_ENV
          echo "$HOME/.pixi/bin"  >> $GITHUB_PATH

      - name: Pixi install
        run: |
          pixi install

      - name: Run tests
        run: |
          pixi run -e test tests
